name: Question
description: Ask a question.
labels:
  - question
body:
  - type: markdown
    attributes:
      value: >
        Ask a question if you need help using `depreman`.

        You can also use this form if you're unsure if you found a bug or if a
        feature is missing.
  - id: version
    type: textarea
    attributes:
      label: Version
      description: |
        Enter the output of `depreman --version`, `npx depreman --version`, or
        `npm ls depreman`.
      placeholder: |
        ex.
        ```
        depreman: 0.3.15
        node: 26.0.0
        npm: 12.0.2
        yarn: 4.1.0
        ```
  - id: question
    type: textarea
    attributes:
      label: Question
      description: |
        What is your question?
    validations:
      required: true
